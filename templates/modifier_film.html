{% extends "base.html" %}

{% block content %}

<section class="form-card">

<h1>Modifier un film</h1>

<form method="POST">

{% csrf_token %}

<label>Titre</label>
<input type="text" name="titre" value="{{ film.1 }}" required>

<label>Année</label>
<input type="number" name="annee_sortie" value="{{ film.2 }}" required>

<label>URL affiche</label>
<input type="text" name="affiche" value="{{ film.3 }}">

<label>Réalisateur</label>
<input type="text" name="realisateur" value="{{ film.4 }}">

<label>Catégorie</label>

<select name="id_categorie">

{% for categorie in categories %}

<option value="{{ categorie.0 }}">
{{ categorie.1 }}
</option>

{% endfor %}

</select>

<button type="submit">
Modifier
</button>

</form>

</section>

{% endblock %}
