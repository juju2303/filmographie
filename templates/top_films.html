{% extends "base.html" %}

{% block content %}

<section class="page-title">
    <h1>Top films</h1>
    <p>Classement basé sur la moyenne des notes.</p>
</section>

<section class="ranking">
    {% for film in films %}
        <a class="rank-card" href="/film/{{ film.0 }}/">
            <div class="rank-number">{{ forloop.counter }}</div>

            {% if film.6 %}
                <img src="{{ film.6 }}" class="rank-poster" alt="{{ film.1 }}">
            {% endif %}

            <div>
                <h3>{{ film.1 }}</h3>
                <p>{{ film.2 }} • {{ film.3 }} • {{ film.4 }}</p>
            </div>

            <strong>★ {{ film.5 }}/10</strong>
        </a>
    {% endfor %}
</section>

{% endblock %}
